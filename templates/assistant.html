<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BIS AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#152342; --ink-soft:#3C4B6B; --paper:#FBF8F1; --paper-deep:#F1ECDE;
    --card:#FFFFFF; --hairline:#E4DFCF; --saffron:#DD6B12; --saffron-deep:#B4520C;
    --leaf:#1E7A4C; --leaf-soft:#E5F2EA; --blue:#2A5DB0; --blue-soft:#EAF0FA;
    --slate:#6E7280; --slate-soft:#F1EFE8;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'IBM Plex Sans', sans-serif; background:var(--paper-deep); }
  svg.icon { display:block; }

  .shell { height:100vh; display:flex; }

  /* sidebar */
  .rail { width:196px; flex-shrink:0; background:var(--ink); display:flex; flex-direction:column; padding:20px 14px; }
  .rail-brand { display:flex; align-items:center; gap:9px; margin-bottom:26px; }
  .rail-logo { width:30px; height:30px; border-radius:7px; background:#F5F2E8; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .rail-title { font-family:'Source Serif 4', serif; font-weight:600; font-size:13.5px; color:#F5F2E8; margin:0; }
  .rail-sub { font-size:9.5px; color:#8892AC; margin:0; }
  .rail-nav { display:flex; flex-direction:column; gap:2px; }
  .rail-item { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:7px; cursor:pointer; color:#B9C0D4; font-size:13px; }
  .rail-item.active { background:rgba(255,255,255,0.09); color:#F5F2E8; font-weight:600; }

  /* main */
  .main { flex:1; display:flex; flex-direction:column; min-width:0; height:100vh; }
  .topbar { display:flex; align-items:center; gap:12px; padding:14px 24px; background:var(--card); border-bottom:1px solid var(--hairline); flex-shrink:0; }
  .topbar-logo { flex-shrink:0; }
  .topbar-title { font-family:'Source Serif 4', serif; font-weight:600; font-size:16px; color:var(--ink); margin:0; }
  .topbar-tagline { font-size:11.5px; color:var(--ink-soft); margin:1px 0 0; line-height:1.35; }
  .topbar-hindi { font-size:9.5px; color:var(--saffron-deep); margin:1px 0 0; font-weight:600; }
  .topbar-meta { display:flex; align-items:center; gap:5px; background:var(--paper-deep); border-radius:7px; padding:5px 10px; font-size:12px; color:var(--ink-soft); flex-shrink:0; }

  .scroll { flex:1; overflow-y:auto; display:flex; justify-content:center; padding:22px 20px 8px; }
  .content { width:100%; max-width:640px; display:flex; flex-direction:column; }

  /* empty state */
  .empty-state { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px 10px; }
  .empty-title { font-family:'Source Serif 4', serif; font-weight:600; font-size:20px; color:var(--ink); margin:18px 0 6px; }
  .empty-sub { font-size:13.5px; color:var(--ink-soft); margin:0 0 22px; max-width:360px; line-height:1.5; }
  .suggestions { display:flex; flex-direction:column; gap:8px; width:100%; max-width:380px; }
  .suggestion-chip { text-align:left; font-size:13px; color:var(--ink-soft); background:var(--card); border:1px solid var(--hairline); border-radius:10px; padding:11px 14px; cursor:pointer; font-family:'IBM Plex Sans', sans-serif; }
  .suggestion-chip:hover { border-color:var(--blue); color:var(--blue); }

  /* thread */
  .thread { display:flex; flex-direction:column; gap:18px; padding-bottom:8px; }
  .turn-user { align-self:flex-end; max-width:78%; background:var(--ink); color:#F5F2E8; font-size:13.5px; line-height:1.5; padding:10px 14px; border-radius:14px 14px 3px 14px; }
  .turn-assistant { display:flex; gap:8px; align-items:flex-start; }
  .turn-avatar { width:24px; height:24px; border-radius:50%; background:var(--blue); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
  .turn-body { flex:1; min-width:0; display:flex; flex-direction:column; gap:14px; }

  .msg-bubble { background:var(--blue-soft); border:1px solid #D7E3F5; border-radius:10px; padding:9px 12px; font-size:13.5px; color:var(--ink); line-height:1.5; max-width:540px; }

  /* stepper */
  .stepper { display:flex; align-items:flex-start; }
  .step-col { display:flex; flex-direction:column; align-items:center; width:74px; }
  .step-dot { width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; background:var(--slate-soft); color:var(--slate); }
  .step-dot.on { background:var(--blue); color:#fff; }
  .step-label { font-size:11px; margin-top:4px; color:var(--slate); text-align:center; }
  .step-label.active { color:var(--ink); font-weight:600; }
  .step-line { flex:1; height:2px; margin-top:11px; background:var(--hairline); }
  .step-line.on { background:var(--blue); }

  .questions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .q-card { background:var(--card); border:1px solid var(--hairline); border-radius:10px; padding:13px 14px; }
  .q-card.wide { grid-column: 1 / -1; }
  .q-row { display:flex; gap:10px; }
  .q-icon { width:32px; height:32px; border-radius:8px; background:var(--paper-deep); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .q-body { flex:1; min-width:0; }
  .q-head { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .q-title { font-size:13.5px; font-weight:600; color:var(--ink); margin:0; line-height:1.4; }
  .q-badge { font-size:10px; font-weight:600; padding:2px 8px; border-radius:999px; white-space:nowrap; background:var(--slate-soft); color:var(--slate); }
  .q-badge.on { background:var(--leaf-soft); color:var(--leaf); }
  .q-hint { font-size:11px; color:var(--slate); margin:2px 0 10px; }
  .chips { display:flex; flex-wrap:wrap; gap:7px; }
  .chip { font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:8px; cursor:pointer; font-family:'IBM Plex Sans', sans-serif; border:1px solid var(--hairline); background:var(--card); color:var(--ink-soft); }
  .chip.on { border-color:var(--blue); background:var(--blue-soft); color:var(--blue); }

  .info-bar { display:flex; gap:8px; background:var(--blue-soft); border:1px solid #D7E3F5; border-radius:8px; padding:9px 11px; }
  .info-bar p { font-size:11.5px; color:var(--blue); margin:0; line-height:1.5; }

  .submit-btn { width:100%; max-width:320px; padding:11px; border-radius:8px; border:none; font-size:13.5px; font-weight:600; font-family:'IBM Plex Sans', sans-serif; cursor:not-allowed; background:var(--slate-soft); color:var(--slate); }
  .submit-btn.ready { cursor:pointer; background:var(--saffron); color:#fff; }

  /* Result presentation card */
  .result { background:var(--card); border:1px solid var(--hairline); border-left:4px solid var(--leaf); border-radius:8px; padding:18px 20px; }
  .result-badge { display:inline-flex; align-items:center; gap:6px; background:var(--leaf-soft); color:var(--leaf); padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; margin-bottom:10px; }
  .result-is { font-family:'Source Serif 4', serif; font-weight:700; font-size:17px; color:var(--ink); margin:0 0 4px; }
  .result-title { font-size:13.5px; color:var(--ink-soft); margin:0 0 14px; line-height:1.4; }
  .result-text { font-size:14px; color:var(--ink); line-height:1.6; margin:0 0 14px; white-space:pre-line; }
  .meta-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; background:var(--paper); border:1px solid var(--hairline); border-radius:8px; padding:12px; margin-bottom:14px; font-size:12px; }
  .meta-grid strong { color:var(--ink); display:block; }
  .contact-box { background:var(--paper-deep); border-radius:8px; padding:10px 14px; font-size:12px; color:var(--ink-soft); }

  .composer-wrap { display:flex; justify-content:center; padding:14px 20px; background:var(--card); border-top:1px solid var(--hairline); flex-shrink:0; }
  .composer { width:100%; max-width:640px; display:flex; align-items:center; gap:10px; }
  .composer input { flex:1; border:1px solid var(--hairline); border-radius:22px; padding:11px 16px; font-size:14px; font-family:'IBM Plex Sans', sans-serif; outline:none; color:var(--ink); background:var(--paper); }
  .send-btn { background:var(--blue); border:none; border-radius:50%; width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }

  .bottomnav { display:none; justify-content:space-around; padding:8px 0; border-top:1px solid var(--hairline); background:var(--paper); flex-shrink:0; }
  .nav-item { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .nav-label { font-size:9.5px; color:var(--slate); }
  .nav-label.active { color:var(--saffron-deep); font-weight:600; }

  @media (max-width: 760px) {
    .rail { display:none; }
    .topbar { padding:11px 14px; }
    .scroll { padding:14px 12px 6px; }
    .questions { grid-template-columns:1fr; }
    .composer-wrap { padding:10px 10px; }
    .bottomnav { display:flex; }
    .step-label { font-size:8.5px; }
  }
</style>
</head>
<body>

<div class="shell">
  <aside class="rail">
    <div class="rail-brand">
      <div class="rail-logo">__LOGO_SMALL__</div>
      <div>
        <p class="rail-title">BIS AI Assistant</p>
        <p class="rail-sub">Byte Busters</p>
      </div>
    </div>
    <nav class="rail-nav" id="rail-nav"></nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="topbar-logo">__LOGO_BIG__</div>
      <div style="flex:1; min-width:0;">
        <p class="topbar-title">BIS AI Assistant</p>
        <p class="topbar-tagline">Your Guide to Indian Standards &amp; BIS Services</p>
        <p class="topbar-hindi">मानक: कार्यशील:</p>
      </div>
      <div class="topbar-meta">__ICON_GLOBE__ English</div>
      <div class="topbar-meta" id="role-badge-display">__ICON_USER__ Role: MSME</div>
    </div>

    <div class="scroll">
      <div class="content" id="content"></div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        __ICON_PAPERCLIP__
        <input type="text" id="composer-input" placeholder="Type your query (e.g. LED bulb standard, verify R-41014095)..." />
        __ICON_MIC__
        <button class="send-btn" id="send-btn">__ICON_SEND__</button>
      </div>
    </div>

    <div class="bottomnav" id="bottomnav"></div>
  </div>
</div>

<script>
/* ---------- inline SVG icons ---------- */
const ICONS = {
  globe: `<svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15 15 0 0 1 0 20a15 15 0 0 1 0-20"/></svg>`,
  user: `<svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>`,
  shieldWhite: `<svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10c-4.5-1.5-8-5-8-10V6z"/><path d="M9 12l2 2l4-4"/></svg>`,
  info: `<svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2A5DB0" stroke-width="2" stroke-linecap="round" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
  paperclip: `<svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11L12 20a4 4 0 0 1-6-6l9-9a2.5 2.5 0 0 1 4 3l-9 9a1 1 0 0 1-1.5-1.5l8-8"/></svg>`,
  mic: `<svg class="icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6E7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg>`,
  send: `<svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`,
  check: `<svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  home: `<svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7l9 7"/><path d="M5 9v11h14V9"/></svg>`,
  history: `<svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>`,
  bookmark: `<svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5l-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`,
  contact: `<svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M15 8h4M15 12h4M6 16h12"/></svg>`,
  package: `<svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B4520C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5l9-5M12 13v8"/></svg>`,
  building: `<svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B4520C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18"/><line x1="9" y1="8" x2="9" y2="8"/><line x1="15" y1="8" x2="15" y2="8"/></svg>`,
  clipboard: `<svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B4520C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="16" rx="2"/><line x1="9" y1="11" x2="15" y2="11"/></svg>`
};

function logoSvg(size){
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40">
    <polygon points="20,3 37,33 3,33" fill="none" stroke="#2A5DB0" stroke-width="3.4" stroke-linejoin="round"/>
    <circle cx="20" cy="24" r="3.4" fill="#D8332A"/>
  </svg>`;
}

document.body.innerHTML = document.body.innerHTML
  .replace("__LOGO_SMALL__", logoSvg(20))
  .replace("__LOGO_BIG__", logoSvg(34))
  .replace("__ICON_GLOBE__", ICONS.globe)
  .replace("__ICON_USER__", ICONS.user)
  .replace("__ICON_PAPERCLIP__", ICONS.paperclip)
  .replace("__ICON_MIC__", ICONS.mic)
  .replace("__ICON_SEND__", ICONS.send);

const activeRole = localStorage.getItem("bis_role") || "MSME";
document.getElementById("role-badge-display").innerHTML = `${ICONS.user} Role: ${activeRole}`;

const STEPS = ["Understand", "Confirm", "Answer", "Complete"];
const thread = [];

const NAV_ITEMS = [
  { icon: "home", label: "Assistant", active: true },
  { icon: "history", label: "Switch Role", action: () => window.location.href = "/" },
  { icon: "bookmark", label: "Saved" },
  { icon: "contact", label: "Helpline" }
];

function renderNav() {
  document.getElementById("rail-nav").innerHTML = NAV_ITEMS.map((n, idx) => `
    <div class="rail-item${n.active ? " active" : ""}" data-nav-idx="${idx}">${ICONS[n.icon]} ${n.label}</div>
  `).join("");

  document.querySelectorAll("#rail-nav .rail-item").forEach(el => {
    el.onclick = () => {
      const idx = el.getAttribute("data-nav-idx");
      if (NAV_ITEMS[idx].action) NAV_ITEMS[idx].action();
    };
  });

  document.getElementById("bottomnav").innerHTML = NAV_ITEMS.map(n => `
    <div class="nav-item">
      <span style="color:${n.active ? "#B4520C" : "#6E7280"}">${ICONS[n.icon]}</span>
      <span class="nav-label${n.active ? " active" : ""}">${n.label}</span>
    </div>
  `).join("");
}

function stepperHtml(clarifyItem) {
  const current = clarifyItem.submitted ? 3 : 2;
  return `<div class="stepper">${STEPS.map((label, i) => {
    const idx = i + 1;
    const state = idx < current ? "done" : idx === current ? "active" : "todo";
    const dot = state === "done" ? ICONS.check : idx;
    return `
      <div class="step-col">
        <div class="step-dot ${state !== "todo" ? "on" : ""}">${dot}</div>
        <span class="step-label ${state === "active" ? "active" : ""}">${label}</span>
      </div>
      ${i < STEPS.length - 1 ? `<div class="step-line ${idx < current ? "on" : ""}"></div>` : ""}
    `;
  }).join("")}</div>`;
}

function questionsHtml(clarifyItem) {
  return `<div class="questions">${clarifyItem.questions.map(q => {
    const value = clarifyItem.answers[q.id];
    const answered = !!value;
    const iconSvg = ICONS[q.icon] || ICONS.package;
    return `
      <div class="q-card wide" data-question="${q.id}">
        <div class="q-row">
          <div class="q-icon">${iconSvg}</div>
          <div class="q-body">
            <div class="q-head">
              <p class="q-title">${q.title}</p>
              <span class="q-badge ${answered ? "on" : ""}">${answered ? "Answered" : "Pending"}</span>
            </div>
            <p class="q-hint">${q.hint || "Select an option"}</p>
            <div class="chips">${(q.options || []).map(o => `
              <button class="chip ${value === o ? "on" : ""}" data-q="${q.id}" data-val="${o}">${o}</button>
            `).join("")}</div>
          </div>
        </div>
      </div>
    `;
  }).join("")}</div>`;
}

function resultHtml(resData) {
  const meta = resData.metadata || {};
  return `<div class="result">
    <div class="result-badge">${ICONS.check} Status: ${meta.status || "Active"}</div>
    <p class="result-is">${meta.is_number || "Indian Standard"}</p>
    <p class="result-title">${meta.title || ""}</p>
    <div class="result-text">${resData.text.replace(/\n/g, '<br/>')}</div>
    <div class="meta-grid">
      <div><strong>Scheme:</strong> ${meta.scheme || "CRS (Scheme-II)"}</div>
      <div><strong>Transition Deadline:</strong> ${meta.transition_deadline || "02 February 2027"}</div>
      <div><strong>Gazette Date:</strong> ${meta.last_updated || "02 February 2026"}</div>
      <div><strong>Confidence Score:</strong> <span style="color:#1E7A4C; font-weight:700;">${resData.confidence || 92}%</span></div>
    </div>
    <div class="contact-box">
      <strong>Official BIS Contact:</strong> ${meta.contact_dept || "CRS Registration Department"} | Phone: ${meta.contact_phone || "+91-11-23230856"} | Email: ${meta.contact_email || "registration@bis.org.in"}
    </div>
  </div>`;
}

function clarifyTurnHtml(clarifyItem) {
  const ready = clarifyItem.questions.every(q => !!clarifyItem.answers[q.id]);
  return `
    <div class="msg-bubble">To provide you with compliant guidance under your selected persona (<strong>${activeRole}</strong>), please confirm the following details:</div>
    ${stepperHtml(clarifyItem)}
    ${questionsHtml(clarifyItem)}
    <div class="info-bar">${ICONS.info}<p>Your answers ground the assistant directly in official gazette notifications.</p></div>
    <button class="submit-btn ${ready ? "ready" : ""}" data-action="submit-clarify" ${ready ? "" : "disabled"}>
      ${ready ? "Find applicable standard" : "Answer all questions to continue"}
    </button>
    ${clarifyItem.submitted && clarifyItem.resultData ? resultHtml(clarifyItem.resultData) : ""}
  `;
}

function renderThread() {
  const content = document.getElementById("content");

  if (thread.length === 0) {
    content.innerHTML = `
      <div class="empty-state">
        <div>${logoSvg(48)}</div>
        <h2 class="empty-title">Ask me anything about Indian Standards</h2>
        <p class="empty-sub">Role active: <strong>${activeRole}</strong>. Tailoring compliance depth, legal clauses, and certification next steps.</p>
        <div class="suggestions">
          <button class="suggestion-chip" data-suggestion="What is the standard for LED lamps and how to get certified?">What is the standard for LED lamps and how to get certified?</button>
          <button class="suggestion-chip" data-suggestion="Is the 2012 version of IS 16102 still valid in 2026?">Is the 2012 version of IS 16102 still valid in 2026?</button>
          <button class="suggestion-chip" data-suggestion="Verify license R-41014095">Verify license R-41014095</button>
        </div>
      </div>
    `;
    content.querySelectorAll(".suggestion-chip").forEach(el => {
      el.addEventListener("click", () => sendMessage(el.dataset.suggestion));
    });
    return;
  }

  content.innerHTML = `<div class="thread">${thread.map(item => {
    if (item.type === "user") return `<div class="turn-user">${escapeHtml(item.text)}</div>`;
    if (item.type === "text") {
      return `
        <div class="turn-assistant">
          <div class="turn-avatar">${ICONS.shieldWhite}</div>
          <div class="turn-body"><div class="msg-bubble">${escapeHtml(item.text)}</div></div>
        </div>
      `;
    }
    if (item.type === "clarify") {
      return `
        <div class="turn-assistant" data-clarify-turn>
          <div class="turn-avatar">${ICONS.shieldWhite}</div>
          <div class="turn-body">${clarifyTurnHtml(item)}</div>
        </div>
      `;
    }
    if (item.type === "result") {
      return `
        <div class="turn-assistant">
          <div class="turn-avatar">${ICONS.shieldWhite}</div>
          <div class="turn-body">${resultHtml(item.data)}</div>
        </div>
      `;
    }
    return "";
  }).join("")}</div>`;

  content.querySelectorAll('[data-clarify-turn]').forEach((turnEl, i) => {
    const clarifyItem = thread.filter(t => t.type === "clarify")[i];
    if (clarifyItem.submitted) return;

    turnEl.querySelectorAll(".chip").forEach(el => {
      el.addEventListener("click", () => {
        clarifyItem.answers[el.dataset.q] = el.dataset.val;
        renderThread();
      });
    });

    const submitBtn = turnEl.querySelector('[data-action="submit-clarify"]');
    if (submitBtn) {
      submitBtn.addEventListener("click", async () => {
        submitBtn.textContent = "Querying BIS Database...";
        submitBtn.disabled = true;

        const summary = Object.entries(clarifyItem.answers).map(([k,v]) => `${k}: ${v}`).join(", ");
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: `User query: ${clarifyItem.originalQuery}. Parameters: ${summary}`,
            role: activeRole,
            is_clarified: true
          })
        });
        const json = await res.json();
        clarifyItem.submitted = true;
        clarifyItem.resultData = json.data;
        renderThread();
        scrollToBottom();
      });
    }
  });

  scrollToBottom();
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function scrollToBottom() {
  const scroll = document.querySelector(".scroll");
  scroll.scrollTop = scroll.scrollHeight;
}

async function sendMessage(text) {
  if (!text || !text.trim()) return;
  const userText = text.trim();
  thread.push({ type: "user", text: userText });
  renderThread();

  if (userText.toUpperCase().includes("R-")) {
    const match = userText.match(/R-\d{8}/i);
    const rNo = match ? match[0].toUpperCase() : "R-41014095";
    const res = await fetch(`/api/verify-license?r_number=${rNo}`);
    const data = await res.json();

    const output = data.found 
      ? `Registration ${data.r_number} is VERIFIED.\nManufacturer: ${data.manufacturer}\nBrand: ${data.brand}\nProduct: ${data.product}\nStatus: ${data.status} (Valid through ${data.valid_till})`
      : data.message;

    thread.push({
      type: "result",
      data: {
        text: output,
        confidence: data.found ? 98 : 35,
        metadata: {
          is_number: data.is_number || "CRS Registration Registry",
          title: data.product || "Compulsory Registration Scheme (CRS)",
          status: data.status || "Unregistered / Warning",
          scheme: "CRS Scheme-II",
          transition_deadline: "Live Portal Query"
        }
      }
    });
    renderThread();
    return;
  }

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: userText, role: activeRole, is_clarified: false })
    });
    const data = await res.json();

    if (data.action === "REQUEST_SLOT_FILL") {
      thread.push({
        type: "clarify",
        questions: data.questions,
        answers: {},
        originalQuery: userText,
        submitted: false
      });
    } else {
      thread.push({ type: "result", data: data.data });
    }
  } catch (err) {
    thread.push({
      type: "text",
      text: "Unable to reach the local server. Ensure Ollama and app.py are running in your terminal."
    });
  }

  renderThread();
}

const input = document.getElementById("composer-input");
document.getElementById("send-btn").addEventListener("click", () => {
  sendMessage(input.value);
  input.value = "";
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    sendMessage(input.value);
    input.value = "";
  }
});

renderNav();
renderThread();
</script>
