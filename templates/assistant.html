<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BIS AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#152342; --ink-soft:#3C4B6B; --paper:#FBF8F1; --paper-deep:#F1ECDE;
    --card:#FFFFFF; --hairline:#E4DFCF; --saffron:#DD6B12; --saffron-deep:#B4520C;
    --leaf:#1E7A4C; --leaf-soft:#E5F2EA; --blue:#2A5DB0; --blue-soft:#EAF0FA;
    --slate:#6E7280; --slate-soft:#F1EFE8; --danger:#C53030; --danger-soft:#FFF5F5;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'IBM Plex Sans', sans-serif; background:var(--paper-deep); }
  svg.icon { display:block; }

  .shell { height:100vh; display:flex; }
  .rail { width:196px; flex-shrink:0; background:var(--ink); display:flex; flex-direction:column; padding:20px 14px; }
  .rail-brand { display:flex; align-items:center; gap:9px; margin-bottom:26px; }
  .rail-logo { width:30px; height:30px; border-radius:7px; background:#F5F2E8; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .rail-title { font-family:'Source Serif 4', serif; font-weight:600; font-size:13.5px; color:#F5F2E8; margin:0; }
  .rail-sub { font-size:9.5px; color:#8892AC; margin:0; }
  .rail-nav { display:flex; flex-direction:column; gap:2px; }
  .rail-item { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:7px; cursor:pointer; color:#B9C0D4; font-size:13px; }
  .rail-item.active { background:rgba(255,255,255,0.09); color:#F5F2E8; font-weight:600; }

  .main { flex:1; display:flex; flex-direction:column; min-width:0; height:100vh; }
  .topbar { display:flex; align-items:center; gap:12px; padding:14px 24px; background:var(--card); border-bottom:1px solid var(--hairline); flex-shrink:0; }
  .topbar-logo { flex-shrink:0; }
  .topbar-title { font-family:'Source Serif 4', serif; font-weight:600; font-size:16px; color:var(--ink); margin:0; }
  .topbar-tagline { font-size:11.5px; color:var(--ink-soft); margin:1px 0 0; line-height:1.35; }
  .topbar-hindi { font-size:9.5px; color:var(--saffron-deep); margin:1px 0 0; font-weight:600; }
  .topbar-meta { display:flex; align-items:center; gap:5px; background:var(--paper-deep); border-radius:7px; padding:5px 10px; font-size:12px; color:var(--ink-soft); flex-shrink:0; }

  .scroll { flex:1; overflow-y:auto; display:flex; justify-content:center; padding:22px 20px 8px; }
  .content { width:100%; max-width:640px; display:flex; flex-direction:column; }

  .empty-state { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px 10px; }
  .empty-title { font-family:'Source Serif 4', serif; font-weight:600; font-size:20px; color:var(--ink); margin:18px 0 6px; }
  .empty-sub { font-size:13.5px; color:var(--ink-soft); margin:0 0 22px; max-width:360px; line-height:1.5; }
  .suggestions { display:flex; flex-direction:column; gap:8px; width:100%; max-width:380px; }
  .suggestion-chip { text-align:left; font-size:13px; color:var(--ink-soft); background:var(--card); border:1px solid var(--hairline); border-radius:10px; padding:11px 14px; cursor:pointer; font-family:'IBM Plex Sans', sans-serif; }
  .suggestion-chip:hover { border-color:var(--blue); color:var(--blue); }

  .thread { display:flex; flex-direction:column; gap:18px; padding-bottom:8px; }
  .turn-user { align-self:flex-end; max-width:78%; background:var(--ink); color:#F5F2E8; font-size:13.5px; line-height:1.5; padding:10px 14px; border-radius:14px 14px 3px 14px; }
  .turn-assistant { display:flex; gap:8px; align-items:flex-start; }
  .turn-avatar { width:24px; height:24px; border-radius:50%; background:var(--blue); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
  .turn-body { flex:1; min-width:0; display:flex; flex-direction:column; gap:14px; }

  .msg-bubble { background:var(--blue-soft); border:1px solid #D7E3F5; border-radius:10px; padding:12px 14px; font-size:13.5px; color:var(--ink); line-height:1.6; max-width:560px; }

  /* Structured Confidence Header Card */
  .confidence-card {
    display:flex; align-items:center; justify-content:space-between;
    background:#FFFFFF; border:1px solid #D7E3F5; border-radius:8px;
    padding:8px 12px; margin-bottom:12px;
  }
  .confidence-tag {
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700;
  }
  .confidence-tag.high { color:var(--leaf); }
  .confidence-tag.low { color:var(--danger); }
  .meter-wrap { width:90px; height:7px; background:var(--slate-soft); border-radius:4px; overflow:hidden; }
  .meter-fill { height:100%; }

  /* Stepper */
  .stepper { display:flex; align-items:flex-start; }
  .step-col { display:flex; flex-direction:column; align-items:center; width:74px; }
  .step-dot { width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; background:var(--slate-soft); color:var(--slate); }
  .step-dot.on { background:var(--blue); color:#fff; }
  .step-label { font-size:11px; margin-top:4px; color:var(--slate); text-align:center; }
  .step-label.active { color:var(--ink); font-weight:600; }
  .step-line { flex:1; height:2px; margin-top:11px; background:var(--hairline); }
  .step-line.on { background:var(--blue); }

  .questions { display:flex; flex-direction:column; gap:12px; }
  .q-card { background:var(--card); border:1px solid var(--hairline); border-radius:10px; padding:13px 14px; }
  .q-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:2px; }
  .q-title { font-size:13.5px; font-weight:600; color:var(--ink); margin:0; }
  .q-badge { font-size:10px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--slate-soft); color:var(--slate); }
  .q-badge.on { background:var(--leaf-soft); color:var(--leaf); }
  .q-hint { font-size:11px; color:var(--slate); margin:2px 0 8px; }
  .chips { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:8px; }
  .chip { font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:8px; cursor:pointer; font-family:'IBM Plex Sans', sans-serif; border:1px solid var(--hairline); background:var(--card); color:var(--ink-soft); }
  .chip.on { border-color:var(--blue); background:var(--blue-soft); color:var(--blue); }
  
  /* Custom other input container */
  .custom-input-box { display:flex; gap:6px; margin-top:6px; }
  .custom-input-box input {
    flex:1; border:1px solid var(--hairline); border-radius:6px; padding:6px 10px; font-size:12px;
    font-family:'IBM Plex Sans', sans-serif; outline:none; background:var(--paper);
  }
  .custom-apply-btn {
    padding:6px 10px; border-radius:6px; border:none; background:var(--ink-soft); color:#fff;
    font-size:11px; font-weight:600; cursor:pointer;
  }

  /* Reconfirmation Modal / Card */
  .reconfirm-box {
    background:var(--card); border:1px solid var(--saffron); border-radius:10px; padding:14px;
    display:flex; flex-direction:column; gap:10px;
  }
  .reconfirm-title { font-size:13.5px; font-weight:700; color:var(--saffron-deep); margin:0; }
  .reconfirm-list { margin:0; padding-left:18px; font-size:12.5px; color:var(--ink); line-height:1.5; }
  .reconfirm-actions { display:flex; gap:10px; }
  .btn-confirm {
    flex:1; padding:9px 12px; border-radius:6px; border:none; background:var(--leaf); color:#fff;
    font-size:13px; font-weight:600; cursor:pointer;
  }
  .btn-reset {
    flex:1; padding:9px 12px; border-radius:6px; border:1px solid var(--hairline); background:var(--card);
    color:var(--danger); font-size:13px; font-weight:600; cursor:pointer;
  }

  .submit-btn { width:100%; max-width:340px; padding:11px; border-radius:8px; border:none; font-size:13.5px; font-weight:600; font-family:'IBM Plex Sans', sans-serif; cursor:not-allowed; background:var(--slate-soft); color:var(--slate); }
  .submit-btn.ready { cursor:pointer; background:var(--saffron); color:#fff; }

  .composer-wrap { display:flex; justify-content:center; padding:14px 20px; background:var(--card); border-top:1px solid var(--hairline); flex-shrink:0; }
  .composer { width:100%; max-width:640px; display:flex; align-items:center; gap:10px; }
  .composer input { flex:1; border:1px solid var(--hairline); border-radius:22px; padding:11px 16px; font-size:14px; font-family:'IBM Plex Sans', sans-serif; outline:none; color:var(--ink); background:var(--paper); }
  .send-btn { background:var(--blue); border:none; border-radius:50%; width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }

  .bottomnav { display:none; justify-content:space-around; padding:8px 0; border-top:1px solid var(--hairline); background:var(--paper); flex-shrink:0; }
  .nav-item { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .nav-label { font-size:9.5px; color:var(--slate); }
  .nav-label.active { color:var(--saffron-deep); font-weight:600; }

  @media (max-width: 760px) {
    .rail { display:none; }
    .topbar { padding:11px 14px; }
    .scroll { padding:14px 12px 6px; }
    .composer-wrap { padding:10px 10px; }
    .bottomnav { display:flex; }
  }
</style>
</head>
<body>

<div class="shell">
  <aside class="rail">
    <div class="rail-brand">
      <div class="rail-logo">__LOGO_SMALL__</div>
      <div>
        <p class="rail-title">BIS AI Assistant</p>
        <p class="rail-sub">Byte Busters</p>
      </div>
    </div>
    <nav class="rail-nav" id="rail-nav"></nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="topbar-logo">__LOGO_BIG__</div>
      <div style="flex:1; min-width:0;">
        <p class="topbar-title">BIS AI Assistant</p>
        <p class="topbar-tagline">Your Guide to Indian Standards &amp; BIS Services</p>
        <p class="topbar-hindi">मानक: कार्यशील:</p>
      </div>
      <div class="topbar-meta">__ICON_GLOBE__ English</div>
      <div class="topbar-meta" id="role-badge-display">__ICON_USER__ Role: MSME</div>
    </div>

    <div class="scroll">
      <div class="content" id="content"></div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        __ICON_PAPERCLIP__
        <input type="text" id="composer-input" placeholder="Type your query (e.g. LED bulb standard, verify R-41014095)..." />
        __ICON_MIC__
        <button class="send-btn" id="send-btn">__ICON_SEND__</button>
      </div>
    </div>

    <div class="bottomnav" id="bottomnav"></div>
  </div>
</div>

<script>
const ICONS = {
  globe: `<svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15 15 0 0 1 0 20a15 15 0 0 1 0-20"/></svg>`,
  user: `<svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>`,
  shieldWhite: `<svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10c-4.5-1.5-8-5-8-10V6z"/><path d="M9 12l2 2l4-4"/></svg>`,
  info: `<svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2A5DB0" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
  paperclip: `<svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E7280" stroke-width="2"><path d="M21 11L12 20a4 4 0 0 1-6-6l9-9a2.5 2.5 0 0 1 4 3l-9 9a1 1 0 0 1-1.5-1.5l8-8"/></svg>`,
  mic: `<svg class="icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6E7280" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg>`,
  send: `<svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`,
  check: `<svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`,
  home: `<svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l9-7l9 7"/><path d="M5 9v11h14V9"/></svg>`,
  history: `<svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>`,
  bookmark: `<svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5l-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`,
  contact: `<svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M15 8h4M15 12h4M6 16h12"/></svg>`
};

function logoSvg(size){
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40">
    <polygon points="20,3 37,33 3,33" fill="none" stroke="#2A5DB0" stroke-width="3.4" stroke-linejoin="round"/>
    <circle cx="20" cy="24" r="3.4" fill="#D8332A"/>
  </svg>`;
}

document.body.innerHTML = document.body.innerHTML
  .replace("__LOGO_SMALL__", logoSvg(20))
  .replace("__LOGO_BIG__", logoSvg(34))
  .replace("__ICON_GLOBE__", ICONS.globe)
  .replace("__ICON_USER__", ICONS.user)
  .replace("__ICON_PAPERCLIP__", ICONS.paperclip)
  .replace("__ICON_MIC__", ICONS.mic)
  .replace("__ICON_SEND__", ICONS.send);

const activeRole = localStorage.getItem("bis_role") || "MSME";
document.getElementById("role-badge-display").innerHTML = `${ICONS.user} Role: ${activeRole}`;

const STEPS = ["Understand", "Select", "Reconfirm", "Complete"];
const thread = [];

const NAV_ITEMS = [
  { icon: "home", label: "Assistant", active: true },
  { icon: "history", label: "Switch Role", action: () => window.location.href = "/" },
  { 
    icon: "bookmark", 
    label: "KYS Directory", 
    action: () => window.open("https://www.services.bis.gov.in/php/BIS_2.0/bisconnect/knowyourstandards/indian_standards/isdetails", "_blank") 
  },
  { 
    icon: "contact", 
    label: "Official Helpline", 
    action: () => window.open("https://www.bis.gov.in/directory/enquiry/?lang=en", "_blank") 
  }
];

function renderNav() {
  document.getElementById("rail-nav").innerHTML = NAV_ITEMS.map((n, idx) => `
    <div class="rail-item${n.active ? " active" : ""}" data-nav-idx="${idx}">${ICONS[n.icon]} ${n.label}</div>
  `).join("");

  document.querySelectorAll("#rail-nav .rail-item").forEach(el => {
    el.onclick = () => {
      const idx = el.getAttribute("data-nav-idx");
      if (NAV_ITEMS[idx].action) NAV_ITEMS[idx].action();
    };
  });

  document.getElementById("bottomnav").innerHTML = NAV_ITEMS.map(n => `
    <div class="nav-item">
      <span style="color:${n.active ? "#B4520C" : "#6E7280"}">${ICONS[n.icon]}</span>
      <span class="nav-label${n.active ? " active" : ""}">${n.label}</span>
    </div>
  `).join("");
}

function stepperHtml(clarifyItem) {
  let current = 2;
  if (clarifyItem.awaitingReconfirm) current = 3;
  if (clarifyItem.submitted) current = 4;

  return `<div class="stepper">${STEPS.map((label, i) => {
    const idx = i + 1;
    const state = idx < current ? "done" : idx === current ? "active" : "todo";
    const dot = state === "done" ? ICONS.check : idx;
    return `
      <div class="step-col">
        <div class="step-dot ${state !== "todo" ? "on" : ""}">${dot}</div>
        <span class="step-label ${state === "active" ? "active" : ""}">${label}</span>
      </div>
      ${i < STEPS.length - 1 ? `<div class="step-line ${idx < current ? "on" : ""}"></div>` : ""}
    `;
  }).join("")}</div>`;
}

function escapeHtml(text) {
  const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
  return String(text).replace(/[&<>"']/g, m => map[m]);
}

function resultHtml(resData) {
  let rawText = resData.text || "";
  let confidence = resData.confidence || 90;
  let isHigh = confidence >= 60;
  let meterColor = isHigh ? "var(--leaf)" : "var(--danger)";

  let safeText = escapeHtml(rawText);
  let formattedText = safeText
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/\n\n/g, '<br/><br/>')
    .replace(/\n\*/g, '<br/>&bull;')
    .replace(/\n/g, '<br/>');

  return `
    <div class="msg-bubble assistant-response">
      <div class="confidence-card">
        <div class="confidence-tag ${isHigh ? 'high' : 'low'}">
          ${isHigh ? 'Verified Standard Match' : 'Out of Scope / Advisory'}
          <span>&bull;</span> Confidence: <strong>${confidence}%</strong>
        </div>
        <div class="meter-wrap">
          <div class="meter-fill" style="width:${confidence}%; background:${meterColor};"></div>
        </div>
      </div>
      <div>${formattedText}</div>
    </div>
  `;
}

function questionsHtml(clarifyItem) {
  return `<div class="questions">${clarifyItem.questions.map(q => {
    const value = clarifyItem.answers[q.id];
    const answered = !!value;
    const isCustom = answered && !(q.options || []).includes(value);

    return `
      <div class="q-card" data-question="${q.id}">
        <div class="q-head">
          <p class="q-title">${q.title}</p>
          <span class="q-badge ${answered ? "on" : ""}">${answered ? "Answered" : "Pending"}</span>
        </div>
        <p class="q-hint">${q.hint || "Select an option or enter your own"}</p>
        <div class="chips">${(q.options || []).map(o => `
          <button class="chip ${value === o ? "on" : ""}" data-q="${q.id}" data-val="${o}">${o}</button>
        `).join("")}</div>
        
        <div class="custom-input-box">
          <input type="text" placeholder="Or enter other / custom..." value="${isCustom ? escapeHtml(value) : ""}" data-custom-q="${q.id}" />
          <button class="custom-apply-btn" data-apply-q="${q.id}">Apply</button>
        </div>
      </div>
    `;
  }).join("")}</div>`;
}

function clarifyTurnHtml(clarifyItem) {
  if (clarifyItem.submitted && clarifyItem.resultData) {
    return resultHtml(clarifyItem.resultData);
  }

  // Phase 2: Explicit Reconfirmation View
  if (clarifyItem.awaitingReconfirm) {
    return `
      <div class="msg-bubble">Please review and confirm your query parameters before sending them to the Bureau of Indian Standards analysis engine:</div>
      ${stepperHtml(clarifyItem)}
      <div class="reconfirm-box">
        <p class="reconfirm-title">Reconfirm Configuration</p>
        <ul class="reconfirm-list">
          <li><strong>Query:</strong> ${escapeHtml(clarifyItem.originalQuery)}</li>
          ${Object.entries(clarifyItem.answers).map(([k, v]) => `<li><strong>${escapeHtml(k)}:</strong> ${escapeHtml(v)}</li>`).join("")}
        </ul>
        <div class="reconfirm-actions">
          <button class="btn-confirm" data-action="execute-confirmed">Confirm &amp; Proceed</button>
          <button class="btn-reset" data-action="cancel-reset">Reset &amp; Start Over</button>
        </div>
      </div>
    `;
  }

  // Phase 1: Slot-Filling View
  const ready = clarifyItem.questions.every(q => !!clarifyItem.answers[q.id]);
  return `
    <div class="msg-bubble">To provide compliant guidance under <strong>${activeRole}</strong>, please complete or customize the following parameters:</div>
    ${stepperHtml(clarifyItem)}
    ${questionsHtml(clarifyItem)}
    <button class="submit-btn ${ready ? "ready" : ""}" data-action="proceed-reconfirm" ${ready ? "" : "disabled"}>
      ${ready ? "Review &amp; Reconfirm Parameters" : "Select or enter all fields to continue"}
    </button>
  `;
}

function renderThread() {
  const content = document.getElementById("content");

  if (thread.length === 0) {
    content.innerHTML = `
      <div class="empty-state">
        <div>${logoSvg(48)}</div>
        <h2 class="empty-title">Ask me anything about Indian Standards</h2>
        <p class="empty-sub">Role active: <strong>${activeRole}</strong>. Verifying technical standards, CRS registries, and test methods.</p>
        <div class="suggestions">
          <button class="suggestion-chip" data-suggestion="I want to build a led lamp guide me through the steps">I want to build a led lamp guide me through the steps</button>
          <button class="suggestion-chip" data-suggestion="indian standards related to led lamps">indian standards related to led lamps</button>
          <button class="suggestion-chip" data-suggestion="Verify license R-41014095">Verify license R-41014095</button>
        </div>
      </div>
    `;
    content.querySelectorAll(".suggestion-chip").forEach(el => {
      el.addEventListener("click", () => sendMessage(el.dataset.suggestion));
    });
    return;
  }

  content.innerHTML = `<div class="thread">${thread.map(item => {
    if (item.type === "user") return `<div class="turn-user">${escapeHtml(item.text)}</div>`;
    if (item.type === "text") {
      return `
        <div class="turn-assistant">
          <div class="turn-avatar">${ICONS.shieldWhite}</div>
          <div class="turn-body"><div class="msg-bubble">${escapeHtml(item.text)}</div></div>
        </div>
      `;
    }
    if (item.type === "clarify") {
      return `
        <div class="turn-assistant" data-clarify-turn>
          <div class="turn-avatar">${ICONS.shieldWhite}</div>
          <div class="turn-body">${clarifyTurnHtml(item)}</div>
        </div>
      `;
    }
    if (item.type === "result") {
      return `
        <div class="turn-assistant">
          <div class="turn-avatar">${ICONS.shieldWhite}</div>
          <div class="turn-body">${resultHtml(item.data)}</div>
        </div>
      `;
    }
    return "";
  }).join("")}</div>`;

  // Event wiring for clarify cards
  content.querySelectorAll('[data-clarify-turn]').forEach((turnEl, i) => {
    const clarifyItem = thread.filter(t => t.type === "clarify")[i];
    if (clarifyItem.submitted) return;

    // Standard chips
    turnEl.querySelectorAll(".chip").forEach(el => {
      el.addEventListener("click", () => {
        clarifyItem.answers[el.dataset.q] = el.dataset.val;
        renderThread();
      });
    });

    // Custom Other input apply
    turnEl.querySelectorAll('[data-apply-q]').forEach(btn => {
      btn.addEventListener("click", () => {
        const qId = btn.getAttribute("data-apply-q");
        const customInput = turnEl.querySelector(`[data-custom-q="${qId}"]`);
        if (customInput && customInput.value.trim()) {
          clarifyItem.answers[qId] = customInput.value.trim();
          renderThread();
        }
      });
    });

    // Proceed to Reconfirmation view
    const reconfirmBtn = turnEl.querySelector('[data-action="proceed-reconfirm"]');
    if (reconfirmBtn) {
      reconfirmBtn.addEventListener("click", () => {
        clarifyItem.awaitingReconfirm = true;
        renderThread();
      });
    }

    // Explicit Confirmation -> Submit to LLM
    const confirmBtn = turnEl.querySelector('[data-action="execute-confirmed"]');
    if (confirmBtn) {
      confirmBtn.addEventListener("click", async () => {
        confirmBtn.textContent = "Synthesizing Official Compliance...";
        confirmBtn.disabled = true;

        const summary = Object.entries(clarifyItem.answers).map(([k,v]) => `${k}: ${v}`).join(", ");
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: `User query: ${clarifyItem.originalQuery}. Selected & Custom Parameters: ${summary}`,
            role: activeRole,
            is_clarified: true
          })
        });
        const json = await res.json();
        clarifyItem.awaitingReconfirm = false;
        clarifyItem.submitted = true;
        clarifyItem.resultData = json.data;
        renderThread();
      });
    }

    // Cancel / Reset -> Reset to start
    const resetBtn = turnEl.querySelector('[data-action="cancel-reset"]');
    if (resetBtn) {
      resetBtn.addEventListener("click", () => {
        thread.length = 0; // Clear conversation to start completely over
        renderThread();
      });
    }
  });

  scrollToBottom();
}

function scrollToBottom() {
  const scroll = document.querySelector(".scroll");
  scroll.scrollTop = scroll.scrollHeight;
}

async function sendMessage(text) {
  if (!text || !text.trim()) return;
  const userText = text.trim();
  thread.push({ type: "user", text: userText });
  renderThread();

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: userText, role: activeRole, is_clarified: false })
    });
    const data = await res.json();

    if (data.action === "REQUEST_SLOT_FILL") {
      thread.push({
        type: "clarify",
        questions: data.questions,
        answers: {},
        originalQuery: userText,
        awaitingReconfirm: false,
        submitted: false
      });
    } else {
      thread.push({ type: "result", data: data.data });
    }
  } catch (err) {
    thread.push({
      type: "text",
      text: "Unable to reach the assistant server. Verify that app.py is running."
    });
  }

  renderThread();
}

const input = document.getElementById("composer-input");
document.getElementById("send-btn").addEventListener("click", () => {
  sendMessage(input.value);
  input.value = "";
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    sendMessage(input.value);
    input.value = "";
  }
});

renderNav();
renderThread();
</script>
</body>
</html>
